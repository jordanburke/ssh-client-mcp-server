[defaults]
port = 22
user = "agent"
tmux_session = "agent"

[pool]
max_per_host = 2
idle_timeout_ms = 60000

# [defaults.policy]
# mode = "readwrite"
# tmux = "approve"          # recommended once approval ships; until then it denies tmux input

# [[cas]]
# name = "home"
# key_cmd = "security find-generic-password -s ssh-fleet-ca -w"   # or key_env / key_file
# principal = "fleet"

# [audit]
# path = "~/.local/state/ssh-fleet/audit.jsonl"   # the default

[[hosts]]
name = "box-a"
host = "10.0.0.11"
user = "fleet-ro"
key = "~/.ssh/id_ed25519"
  [hosts.policy]
  mode = "readonly"
  allow = ["sudo systemctl status [\\w@.-]+", "sudo journalctl -u [\\w@.-]+ -n \\d+", "df -h", "uptime"]

[[hosts]]
name = "box-b"
host = "build.example.com"
agent = true
log_output = true   # add an excerpt of exec output to the audit log

[[hosts]]
name = "box-c"
host = "192.168.1.50"
password_env = "BOXC_SSH_PASSWORD"   # value read from the env var, never inline

